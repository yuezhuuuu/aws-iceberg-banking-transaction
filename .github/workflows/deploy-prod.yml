name: Deploy — Prod

on:
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # 1. Terraform apply to prod environment
  # ─────────────────────────────────────────
  terraform-apply-prod:
    name: Terraform Apply (prod)
    runs-on: ubuntu-latest
    # GitHub environment with required reviewers — add approvers in repo settings
    environment: prod
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.10'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Terraform Init
        run: terraform init -backend-config=backend-prod.hcl

      - name: Terraform Plan
        id: plan
        run: terraform plan -var-file=prod.tfvars -out=tfplan -no-color

      - name: Terraform Apply
        run: terraform apply tfplan -no-color

      - name: Show Terraform Outputs
        run: terraform output -no-color

  # ─────────────────────────────────────────
  # 2. Post-deploy verification
  #    Read from the prod Iceberg table to
  #    confirm the stack is healthy
  # ─────────────────────────────────────────
  verify-prod:
    name: Verify Prod Deployment
    runs-on: ubuntu-latest
    needs: [terraform-apply-prod]
    env:
      ENV: prod
      AWS_REGION: eu-central-1
      BUCKET_NAME: ${{ secrets.PROD_BUCKET_NAME }}
      GLUE_DATABASE_NAME: transaction_db_prod
      TABLE_NAME: transaction_logs
      # Producer settings — not used for verify, but Config.validate() requires them
      TARGET_TPS: "10"
      OUTPUT_DIR: /tmp/verify
      ROTATE_SECONDS: "60"
      ROTATE_SIZE_MB: "64"
      DURATION_SECONDS: "0"
      AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry==2.1.3

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install

      - name: Verify prod Iceberg table is accessible
        run: poetry run python -m producer.read_iceberg
