name: Deploy — Dev

on:
  push:
    branches: [develop]

jobs:
  # ─────────────────────────────────────────
  # 1. Terraform apply to dev environment
  # ─────────────────────────────────────────
  terraform-apply-dev:
    name: Terraform Apply (dev)
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.10'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Terraform Init
        run: terraform init -backend-config=backend-dev.hcl

      - name: Terraform Apply
        run: terraform apply -var-file=dev.tfvars -auto-approve -no-color

      - name: Show Terraform Outputs
        run: terraform output -no-color

  # ─────────────────────────────────────────
  # 2. Smoke test: generate transactions and
  #    write a small batch to S3/Iceberg
  # ─────────────────────────────────────────
  smoke-test:
    name: Smoke Test (dev)
    runs-on: ubuntu-latest
    needs: [terraform-apply-dev]
    env:
      ENV: dev
      OUTPUT_DIR: /tmp/smoke-transactions
      TARGET_TPS: "50"
      ROTATE_SECONDS: "30"
      ROTATE_SIZE_MB: "1"
      DURATION_SECONDS: "10"
      AWS_REGION: eu-central-1
      BUCKET_NAME: ${{ secrets.DEV_BUCKET_NAME }}
      GLUE_DATABASE_NAME: transaction_db_dev
      TABLE_NAME: transaction_logs
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry==2.1.3

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install

      - name: Run producer (10s smoke test)
        run: poetry run python -m producer.producer

      - name: Write JSONL to S3/Iceberg
        run: poetry run python -m producer.write_to_s3

      - name: Verify Iceberg table is readable
        run: poetry run python -m producer.read_iceberg
